[project]
name = "netguard-common"
version = "0.1.0"
description = "Shared code for NetGuard services: message schemas, JSON logging with trace IDs, config, broker helpers"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
kafka = ["confluent-kafka>=2.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netguard_common = ["schemas/*.json"]
