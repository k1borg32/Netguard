# Disposable database owned by the pytest session. No application volumes or .env credentials.
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: netguard_test
      POSTGRES_DB: netguard_test
      POSTGRES_PASSWORD: ${NETGUARD_TEST_DB_PASSWORD:?Started automatically by pytest}
    ports:
      - "127.0.0.1::5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "netguard_test", "-d", "netguard_test"]
      interval: 1s
      timeout: 5s
      retries: 60
