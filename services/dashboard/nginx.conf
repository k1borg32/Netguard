server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's DNS: look up the api container on every request, so recreating it doesn't leave nginx
    # pointing at an old IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # SEC-08 / SEC-12: only our own scripts may run. Recharts sets inline styles, hence 'unsafe-inline' for styles.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # The dashboard calls /api/v1/... ; forwarded to the API with the same path (no CORS needed).
    location /api/v1/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/health {
        proxy_pass $api/health;
    }

    # Built files have a hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # React Router: every other path is a page of the app.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
