name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e "libs/common[kafka]" -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest -m "not integration" -q --junitxml=results/unit.xml --cov --cov-report=term-missing --cov-report=xml:results/coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-results
          path: results/

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/dashboard/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Component tests
        run: npm test
      - name: Build
        run: npm run build

  integration:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # the override only adds the image build cache, the stack is the same as in the README
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # gives `docker compose build` access to the Actions cache (type=gha in docker-compose.ci.yml)
      - uses: crazy-max/ghaction-github-runtime@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test deps
        run: pip install -e "libs/common[kafka]" -r requirements-dev.txt
      - name: API integration tests (isolated Docker database, sequential)
        run: pytest services/api/tests/integration -q --junitxml=results/api-integration.xml
      - name: Start stack (NFR05, same command as in the README)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Full-stack integration tests
        run: pytest -m stack -q --junitxml=results/integration.xml
      - name: Scale + kill one processor (NFR03/NFR04 smoke)
        run: |
          docker compose up -d --no-deps --scale processor=2 --wait processor
          docker kill $(docker compose ps -q processor | head -1)
          pytest -m stack -q -k port_scan
      - name: Dump logs on failure
        if: failure()
        run: |
          mkdir -p results
          docker compose ps -a
          docker compose logs --no-color > results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: results/
      - name: Tear down
        if: always()
        run: docker compose down -v
