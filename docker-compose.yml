# NetGuard - full platform. One command (NFR05):
#   cp .env.example .env && docker compose up -d --build
# Scale the processor (NFR03) without touching the other services:
#   docker compose up -d --no-deps --scale processor=3 processor
#
# Published ports are bound to 127.0.0.1: the DB and broker have no real auth in dev,
# so they must not be reachable from the rest of the network.

x-python-service: &py
  restart: unless-stopped          # NFR04: crashed instances come back on their own
  init: true                       # tini as PID 1: forwards SIGTERM, so stop/restart is quick
  env_file: .env
  environment:
    BROKER_BOOTSTRAP: redpanda:9092
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  depends_on:
    redpanda: { condition: service_healthy }
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --mode dev-container          # single node, low memory: fine for laptops
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["127.0.0.1:19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      redpanda: { condition: service_healthy }
    profiles: [debug]                 # docker compose --profile debug up

  db:
    image: timescale/timescaledb:2.17.2-pg16
    env_file: .env
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  simulator:
    <<: *py
    build: { context: ., dockerfile: services/python.Dockerfile, args: { SERVICE: simulator } }
    command: ["python", "simulator.py"]
    profiles: [sim]                   # started on demand: make sim / make perf

  processor:
    <<: *py
    build: { context: ., dockerfile: services/python.Dockerfile, args: { SERVICE: processor } }
    command: ["python", "processor.py"]
    environment:
      BROKER_BOOTSTRAP: redpanda:9092
      DETECTION_CONFIG: /app/config/detection.yaml

  persister:
    <<: *py
    build: { context: ., dockerfile: services/python.Dockerfile, args: { SERVICE: persister } }
    command: ["python", "persister.py"]
    depends_on:
      redpanda: { condition: service_healthy }
      db: { condition: service_healthy }

  api:
    <<: *py
    build: { context: ., dockerfile: services/python.Dockerfile, args: { SERVICE: api } }
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import json, sys, urllib.request; health = json.load(urllib.request.urlopen('http://localhost:8000/health')); sys.exit(health['status'] != 'ok')"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: nginx:1.27-alpine
    volumes:
      - ./services/dashboard/index.html:/usr/share/nginx/html/index.html:ro
      - ./services/dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:3000:80"]
    depends_on: [api]

volumes:
  dbdata:
